# E2g MOCK Z1 JOINT CONTROL: loopback MuJoCo + MOCK worker ONLY.
# NEVER use this config with real B2/Z1. No real Z1 TARGET, no new B2 motor output.
# Enter FixStand in MuJoCo then press g. Inside Real FSM, +/- jog mock J5, 0 returns.
