robot: "go2"
robot_scene: "src/assets/robots/unitree_go2/xmls/scene_go2.xml"
# robot: "a2"
# robot_scene: "src/assets/robots/unitree_a2/xmls/scene_a2.xml"

domain_id: 0  # Domain id
interface: "lo" # Interface

use_joystick: 0 # For b2z1 sim-in-the-loop, let the deploy controller own teleop input by default
joystick_type: "xbox" # support "keyboard", "xbox" and "switch"
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 0 # Virtual spring band, used for lifting h1

lightweight_realism:
  joint_pos_noise_std: 0.001
  joint_vel_noise_std: 0.03
  imu_gyro_noise_std: 0.008
  imu_acc_noise_std: 0.05
  imu_rpy_noise_std: 0.003
  base_lin_vel_noise_std: 0.01
  action_delay_ms: 4
  ctrl_noise_std: 0.0
  ctrl_noise_rate: 2.0
  randomize_foot_friction: 1
  foot_friction_range: [0.40, 0.50]
